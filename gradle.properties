# Memory is kept modest: this is a small project, built alongside Android Studio and an emulator.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle process instead of starting a second background Java process.
kotlin.compiler.execution.strategy=in-process
# Background build processes quit after 15 idle minutes instead of staying for 3 hours.
org.gradle.daemon.idletimeout=900000
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
